[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-radar"
version = "0.1.0"
description = "A numerical dataset drift monitor using reference quantile bins and population stability index."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Isaiah Boyd"}]
dependencies = []

[project.scripts]
drift-radar = "drift_radar:main"

[tool.setuptools]
py-modules = ["drift_radar"]
